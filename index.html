<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spell Sigils</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the 512px icon is for a web app manifest, should the site get one -->
<link rel="icon" href="favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-192x192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="favicon-192x192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- start fetching the spell data with the page instead of after the scripts run; js/ui.js picks it up -->
<link rel="preload" href="data/spells.json" as="fetch" crossorigin>
<link rel="preload" href="data/classes.json" as="fetch" crossorigin>
</head>
<body>
<div class="app">
  <!-- on a phone the sidebar becomes a drawer that slides over the page (see styles.css) -->
  <aside class="sidebar" id="sidebar">
    <h1>Spell Sigils<span>drawn from the four currents</span></h1>
    <button class="drawer-close" id="drawerClose" type="button" aria-label="Close the spell list">×</button>
    <div class="search"><input id="search" type="text" placeholder="Search a spell…" autocomplete="off"></div>
    <div class="filters" id="tradFilters" role="group" aria-label="Tradition or category"></div>
    <div class="filters" id="classFilters" role="group" aria-label="Focus spell class" hidden></div>
    <div class="rank-row" id="rankFilters" role="group" aria-label="Rank"></div>
    <div class="count" id="count" aria-live="polite">Loading spells…</div>
    <ul class="list" id="list" role="listbox" aria-label="Spells"></ul>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <main class="stage">
    <header class="topbar">
      <span class="topbar-title">Spell Sigils</span>
      <button class="topbar-btn" id="drawerOpen" type="button" aria-controls="sidebar" aria-expanded="false">Spells</button>
    </header>
    <div class="circle-wrap">
      <!-- one image to assistive technology, labelled with the spell it shows (showSpell in js/ui.js) -->
      <svg id="sigil" viewBox="0 0 600 600" role="img" aria-label="Spell sigil">
        <defs>
          <!-- every part of the glow lives in this one filter, driven by setGlow (js/sigil.js): Safari
               ignores CSS drop-shadow() on SVG elements, and drops the whole filter list with it.
               Copied images always use it (captureSigilSvg in js/ui.js) -->
          <filter id="sigilGlow" x="-60%" y="-60%" width="220%" height="220%">
            <!-- a wide, dim haze in a darkened version of each line's own color, behind the crisp lines -->
            <feGaussianBlur id="sigilBlurFar" in="SourceGraphic" stdDeviation="0" result="blurFar"/>
            <feColorMatrix id="sigilBlurFarColor" in="blurFar" type="matrix" values="0.55 0 0 0 0  0 0.55 0 0 0  0 0 0.55 0 0  0 0 0 1 0" result="glowFar"/>
            <feMerge result="lit">
              <feMergeNode in="glowFar"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
            <!-- two neon halos in the spell's main color, each a blurred silhouette of everything before
                 it laid underneath: feDropShadow is what a CSS drop-shadow() is defined as, chained here as
                 the two CSS drop-shadows were, and blending in sRGB as CSS filters do -->
            <feDropShadow id="sigilHaloA" in="lit" dx="0" dy="0" stdDeviation="0" flood-color="#8fd0ff" color-interpolation-filters="sRGB" result="litA"/>
            <feDropShadow id="sigilHaloB" in="litA" dx="0" dy="0" stdDeviation="0" flood-color="#8fd0ff" color-interpolation-filters="sRGB"/>
          </filter>
        </defs>
        <!-- setGlow (js/sigil.js) gives this the glow filter only while the glow shows -->
        <g id="sigilRoot" class="glow"></g>
      </svg>
    </div>
    <!-- the two display modes, lit while on, then Export -->
    <div class="toolbar" id="toolbar">
      <button class="tool" id="bgToggle" type="button" aria-pressed="false" aria-label="Parchment" title="Parchment">
        <!-- a hanging scroll: a roll at each end, the sheet between them, two lines of writing -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="4" rx="2"/><rect x="4" y="17" width="16" height="4" rx="2"/><path d="M6 7v10M18 7v10M9 10.5h6M9 13.5h4"/></svg>
      </button>
      <button class="tool" id="maxGlowToggle" type="button" aria-pressed="false" aria-label="Max glow" title="Max glow">
        <!-- a sun -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      </button>
      <span class="tool-gap"></span>
      <button class="tool" id="exportOpen" type="button" aria-label="Export" title="Export" aria-haspopup="dialog" aria-expanded="false" aria-controls="exportPanel">
        <!-- an arrow up out of an open box -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M7 11H5v9h14v-9h-2"/></svg>
      </button>
      <!-- what to export, then what to do with it (js/export.js) -->
      <div class="export-panel" id="exportPanel" role="dialog" aria-label="Export" hidden>
        <div class="export-what" role="radiogroup" aria-label="What to export">
          <!-- an inked sigil can also be an SVG, for documents and print -->
          <label><input type="radio" name="exportKind" value="image" checked> Image <span class="fmt" id="imagePng">PNG</span>
            <select id="imageFormat" aria-label="Image format" hidden><option value="png">PNG</option><option value="svg">SVG</option></select></label>
          <label><input type="radio" name="exportKind" value="animation"> Animation
            <select id="exportFormat" aria-label="Animation format"><option value="mp4">MP4</option><option value="webm">WebM</option></select></label>
        </div>
        <!-- an image's background, the dark ground or the paper as the mode has it; a video always has one -->
        <label class="export-ground"><input type="checkbox" id="exportGround"> <span id="exportGroundLabel">Dark background</span></label>
        <div class="export-actions">
          <button type="button" id="exportCopy">Copy</button>
          <button type="button" id="exportSave">Save</button>
          <button type="button" id="exportShare" hidden>Share</button>
        </div>
        <div class="export-progress" id="exportProgressRow" hidden>
          <canvas id="exportPreview" aria-hidden="true"></canvas>
          <progress id="exportProgress" max="1" value="0" aria-label="Animation progress"></progress>
          <button type="button" id="exportCancel">Cancel</button>
        </div>
        <p class="export-status" id="exportStatus" aria-live="polite"></p>
      </div>
    </div>
    <!-- under the circle in a portrait stage; split into the corners in a landscape one (see styles.css) -->
    <div class="readout">
      <div class="title">
        <div class="note" id="roNote" hidden></div>
        <div class="name" id="roName">—</div>
        <div class="rank" id="roRank"></div>
      </div>
      <div class="badges" id="roBadges"></div>
      <div class="traits" id="roTraits"></div>
    </div>
  </main>
  <!-- the links to help, which carries the Paizo notice and the credits, and to the symbol atlas: at the
       foot of the sidebar column on wide screens, and under the sigil on a phone -->
  <footer class="legal">
    <p><a href="help.html">Help, notices and credits</a> · <a href="atlas.html">Symbol atlas</a> · <span id="sigilVersion"></span></p>
  </footer>
</div>

<script src="js/core.js"></script>
<script src="js/symbols.js"></script>
<script src="js/sigil.js"></script>
<script src="js/ui.js"></script>
<script src="js/export.js"></script>
</body>
</html>
